name: Release robot checks (AI flag + sound)
# Checks new release submissions every 30 minutes. Free on public repos.
# Needs the repository secret AI_CHECK_KEY (same value as the Apps Script property AI_CHECK_KEY).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy scipy onnxruntime
      - name: Check submissions
        env:
          AUTOMATION_URL: https://script.google.com/macros/s/AKfycbxuMic9BC8cBEvKvUcND7f5n364jceS0Ev2WUmDBmsshuorqFIcYokUsigfns0S2WHP/exec
          AI_CHECK_KEY: ${{ secrets.AI_CHECK_KEY }}
        run: python scripts/rrr_checks.py
