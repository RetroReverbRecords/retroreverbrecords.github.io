name: Update catalogue from Bandcamp
on:
  schedule:
    - cron: "17 5 * * *"   # every day, early morning
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_catalogue.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain assets/catalogue.json)" ]; then
            git config user.name "RRR catalogue bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/catalogue.json
            git commit -m "Update catalogue from Bandcamp"
            git push
          else
            echo "No changes"
          fi
