name: Release robot checks (AI flag + sound)
# Checks new release submissions every hour. If nothing is waiting it stops after a few
# seconds, so it uses very few Actions minutes (important once the repo is private).
# Needs the repository secret AI_CHECK_KEY (same value as the Apps Script property AI_CHECK_KEY).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Anything to check?
        id: q
        env:
          AUTOMATION_URL: https://script.google.com/macros/s/AKfycbxuMic9BC8cBEvKvUcND7f5n364jceS0Ev2WUmDBmsshuorqFIcYokUsigfns0S2WHP/exec
          AI_CHECK_KEY: ${{ secrets.AI_CHECK_KEY }}
        run: |
          n=$(curl -sL --max-time 60 -G "$AUTOMATION_URL" --data-urlencode "aiqueue=1" --data-urlencode "key=$AI_CHECK_KEY" | python3 -c "import sys,json
          try: print(len(json.load(sys.stdin).get('items',[])))
          except Exception: print(1)")
          echo "Waiting: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.q.outputs.n != '0'
      - uses: actions/setup-python@v5
        if: steps.q.outputs.n != '0'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.q.outputs.n != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy scipy onnxruntime
      - name: Check submissions
        if: steps.q.outputs.n != '0'
        env:
          AUTOMATION_URL: https://script.google.com/macros/s/AKfycbxuMic9BC8cBEvKvUcND7f5n364jceS0Ev2WUmDBmsshuorqFIcYokUsigfns0S2WHP/exec
          AI_CHECK_KEY: ${{ secrets.AI_CHECK_KEY }}
        run: python scripts/rrr_checks.py
